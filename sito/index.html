<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4c7a52">
  <meta name="description" content="OrtolApp — progetto dimostrativo di delivery di prodotti ortofrutticoli.">
  <title>OrtolApp</title>
  <link rel="icon" href="assets/icona.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/flatpickr.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/anime.min.js"></script>
  <script defer src="vendor/dayjs.min.js"></script>
  <script defer src="vendor/dayjs-utc.js"></script>
  <script defer src="vendor/dayjs-timezone.js"></script>
  <script defer src="vendor/dayjs-it.js"></script>
  <script defer src="vendor/flatpickr.min.js"></script>
  <script defer src="vendor/flatpickr-it.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="presentation">
    <div class="device-space" id="device-space">
      <div class="device" id="device">
        <i class="hardware action-button" aria-hidden="true"></i><i class="hardware volume-up" aria-hidden="true"></i><i class="hardware volume-down" aria-hidden="true"></i><i class="hardware power" aria-hidden="true"></i>
        <div class="screen" id="screen">
          <div class="status-bar" aria-hidden="true"><span id="clock">9:41</span><div class="island"></div><span class="status-icons"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></span></div>
          <div id="app"></div>
          <div id="modal-root"></div>
          <div id="toast" role="status" aria-live="polite"></div>
          <span class="home-indicator" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="touch-cursor" id="touch-cursor" aria-hidden="true"></div>
  <noscript>Per utilizzare OrtolApp, abilita JavaScript nel browser.</noscript>
</body>
</html>
