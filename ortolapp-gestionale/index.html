<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4c7a52">
  <meta name="description" content="Gestionale dimostrativo per OrtolApp.">
  <title>OrtolApp Gestionale</title>
  <link rel="icon" href="../sito/assets/icona.svg" type="image/svg+xml">
  <link rel="preload" href="../sito/vendor/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script defer src="../sito/js/data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="icon-filters" aria-hidden="true" width="0" height="0">
    <defs>
      <filter id="nav-icon-cream" color-interpolation-filters="sRGB">
        <feFlood flood-color="#FAF6EE"/>
        <feComposite in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="icon-orange" color-interpolation-filters="sRGB">
        <feFlood flood-color="#C85A3E"/>
        <feComposite in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="icon-brown" color-interpolation-filters="sRGB">
        <feFlood flood-color="#5C4433"/>
        <feComposite in2="SourceAlpha" operator="in"/>
      </filter>
    </defs>
  </svg>
  <div class="app-frame">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="OrtolApp gestionale">
        <img src="../sito/assets/logo-homepage.svg" alt="OrtolApp">
        <span>gestionale</span>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Navigazione principale"></nav>
      <div class="sidebar-foot">
        <button class="operator" data-action="profile">
          <span class="avatar" aria-hidden="true"></span>
          <strong>Amministratore</strong>
        </button>
      </div>
    </aside>

    <div class="page-shell">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="mobile-menu" aria-label="Apri menu"><span class="ui-icon" aria-hidden="true"><img src="assets/icons/menu.svg" alt=""></span></button>
        <div class="mobile-brand"><img src="../sito/assets/icona.svg" alt=""><strong>OrtolApp</strong></div>
        <label class="global-search">
          <span class="ui-icon" aria-hidden="true"><img src="assets/icons/search.svg" alt=""></span>
          <input id="global-search" type="search" placeholder="Cerca ordini, clienti, prodotti..." autocomplete="off">
          <kbd>Ctrl K</kbd>
        </label>
        <div class="top-actions">
          <span class="live"><i></i> Sistema operativo</span>
          <button class="icon-button notification-button" data-action="notifications" aria-label="Notifiche"><img src="../sito/assets/icons/campanella.svg" alt=""><b>3</b></button>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <div class="mobile-overlay" id="mobile-overlay"></div>
  <div class="modal-root" id="modal-root" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
